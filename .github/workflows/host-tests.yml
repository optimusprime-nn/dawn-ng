# dawn-ng .github/workflows/host-tests.yml — self-hosted version.
# Same steps as before; runs in an ubuntu:24.04 container on the Linux CI VM.
name: Host tests (ASan/UBSan)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: [self-hosted, linux, big]
    container: ubuntu:24.04
    steps:
      - name: Prepare container
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl sudo build-essential

      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libjson-c-dev libgcrypt20-dev

      - name: Build libubox and ubus
        run: PREFIX="$HOME/deps" tools/ci/build-host-deps.sh

      - name: Run tests
        run: PREFIX="$HOME/deps" tools/ci/run-host-tests.sh
