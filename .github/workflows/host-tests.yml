name: Host tests (ASan/UBSan)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libjson-c-dev libgcrypt20-dev python3-cryptography

      - name: Build libubox, ubus, uci
        run: PREFIX="$HOME/deps" tools/ci/build-host-deps.sh

      - name: Run tests
        run: PREFIX="$HOME/deps" tools/ci/run-host-tests.sh

      - name: Daemon integration test (two APs, fake hostapd)
        run: |
          set -o pipefail
          PREFIX="$HOME/deps" tools/ci/run-integration-test.sh 2>&1 | tee "$RUNNER_TEMP/it.log" || {
            # Also as an annotation: readable through the API without log access
            tail -c 20000 "$RUNNER_TEMP/it.log" | python3 -c 'import sys; d=sys.stdin.read(); print("::error title=Integration test failed::" + d.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          }
