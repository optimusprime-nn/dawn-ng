# dawn-ng .github/workflows/luci-tests.yml — self-hosted version.
# setup-python inside the ubuntu:24.04 container replaces the hosted image's
# system pip (24.04's own pip refuses system-wide installs, PEP 668).
name: LuCI tests

on:
  push:
    paths: [ 'openwrt/luci-app-dawn/**', 'tools/luci-test/**', 'dawn-config', '.github/workflows/luci-tests.yml' ]
  pull_request:
    paths: [ 'openwrt/luci-app-dawn/**', 'tools/luci-test/**', 'dawn-config', '.github/workflows/luci-tests.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luci:
    runs-on: [self-hosted, linux, big]
    container: ubuntu:24.04
    steps:
      - name: Prepare container
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl sudo

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch LuCI runtime (luci-base + bootstrap theme)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openwrt/luci.git "$RUNNER_TEMP/luci"
          git -C "$RUNNER_TEMP/luci" sparse-checkout set modules/luci-base/htdocs themes/luci-theme-bootstrap/htdocs

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python tools/luci-test/run.py --luci "$RUNNER_TEMP/luci" --shots "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luci-screenshots
          path: ${{ runner.temp }}/shots/
